name: Run Gosec Security Checker
on: push
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
      GOSECGOVERSION: 1.27.3
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: ./...
